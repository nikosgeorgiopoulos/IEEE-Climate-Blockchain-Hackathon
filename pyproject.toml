[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
