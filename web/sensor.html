<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensor · ProofOfAir</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2322c55e'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="page">
    <div class="page-head">
      <div>
        <a href="/" class="muted" style="font-size:14px">← Live map</a>
        <h1 id="title" style="margin-top:6px">Sensor</h1>
        <p id="subtitle">–</p>
      </div>
      <div id="head-status"></div>
    </div>

    <section class="grid cols-4">
      <div class="stat"><div class="label">Latest PM2.5</div><div class="value" id="s-pm25">–</div><div class="sub" id="s-pm25-sub">–</div></div>
      <div class="stat"><div class="label">Latest PM10</div><div class="value" id="s-pm10">–</div><div class="sub" id="s-time">–</div></div>
      <div class="stat"><div class="label">Readings · 24 h</div><div class="value" id="s-count">–</div><div class="sub" id="s-avg">–</div></div>
      <div class="stat"><div class="label">Verified</div><div class="value" id="s-ratio">–</div><div class="sub" id="s-ratio-sub">–</div></div>
    </section>

    <section class="card" style="margin-top:18px">
      <div class="card-head">
        <h2>PM2.5 &amp; PM10 · last 24 h</h2>
        <span class="muted" style="font-size:13px">dashed line: WHO 2021 PM2.5 guideline (15 µg/m³) · red dots: readings that fail verification</span>
      </div>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Readings</h2>
        <span class="muted" style="font-size:13px" id="table-meta"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Time</th><th class="num">PM2.5</th><th class="num">PM10</th><th class="num">Temp °C</th>
            <th class="num">RH %</th><th>Batch</th><th>Status</th><th></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="empty">loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"
          integrity="sha256-/tanOfjQ8GhxdN5s0UdF/A/HgJFEqxE9IpCKJr8Nf+o=" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/verify-modal.js"></script>
  <script src="/js/sensor.js"></script>
</body>
</html>
